<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DlStream">
  <title>DlStream</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="boot" class="boot">
    <div class="spinner" aria-hidden="true"></div>
    <strong>DlStream</strong>
    <span id="bootMessage">Chargement de la plateforme…</span>
    <section id="bootError" class="boot-error" hidden>
      <p id="errorText"></p>
      <button id="retryButton" type="button">Réessayer</button>
      <button id="directButton" type="button">Ouvrir directement</button>
      <details>
        <summary>Configuration</summary>
        <form id="configForm">
          <input id="platformUrl" type="url" inputmode="url" autocomplete="url" spellcheck="false">
          <button type="submit">Enregistrer et ouvrir</button>
        </form>
      </details>
    </section>
  </main>
  <script src="./ashell-safe.js?v=29"></script>
  <script type="module" src="./app.js?v=25"></script>
</body>
</html>
