<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DlStream">
  <title>DlStream</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="boot" class="boot">
    <div class="spinner" aria-hidden="true"></div>
    <strong>DlStream</strong>
    <span id="bootMessage">Chargement de la plateforme…</span>
    <section id="bootError" class="boot-error" hidden>
      <p id="errorText"></p>
      <button id="retryButton" type="button">Réessayer</button>
      <button id="directButton" type="button">Ouvrir directement</button>
      <details>
        <summary>Configuration</summary>
        <form id="configForm">
          <input id="platformUrl" type="url" inputmode="url" autocomplete="url" spellcheck="false">
          <button type="submit">Enregistrer et ouvrir</button>
        </form>
      </details>
    </section>
  </main>
  <script>window.__DLSTREAM_RELEASE__='45';</script>
  <script src="./virtual-location.js?v=45"></script>
  <script src="./route-sync.js?v=45"></script>
  <script src="./asset-compat.js?v=45"></script>
  <script src="./astro-compat.js?v=45"></script>
  <script src="./inline-location.js?v=45"></script>
  <script src="./media-filter.js?v=45"></script>
  <script src="./iframe-direct.js?v=45"></script>
  <script src="./spa-compat.js?v=45"></script>
  <script src="./transparent-response.js?v=45"></script>
  <script src="./ashell-safe.js?v=45"></script>
  <script src="./platform-manager.js?v=45"></script>
  <script src="./media-observer-v2.js?v=45"></script>
  <script src="./embedded-player.js?v=45"></script>
  <script src="./embed-bridge.js?v=45"></script>
  <script src="./version-badge.js?v=45"></script>
  <script src="./compat-status.js?v=45"></script>
  <script src="./framework-status.js?v=45"></script>
  <script src="./ui-fixes.js?v=45"></script>
  <script type="module">
    async function waitForV45Worker() {
      if (!('serviceWorker' in navigator)) return;
      const message = document.querySelector('#bootMessage');
      if (message) message.textContent = 'Activation de DlStream v45…';

      const registration = await navigator.serviceWorker.register('./sw.js?v=45');
      await navigator.serviceWorker.ready;

      const controllerIsV45 = () => String(navigator.serviceWorker.controller?.scriptURL || '').includes('v=45');
      if (controllerIsV45()) return;

      await new Promise((resolve) => {
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          navigator.serviceWorker.removeEventListener('controllerchange', onChange);
          clearTimeout(timer);
          resolve();
        };
        const onChange = () => controllerIsV45() && finish();
        const timer = setTimeout(finish, 2500);
        navigator.serviceWorker.addEventListener('controllerchange', onChange);
        registration.update().catch(() => {});
      });
    }

    try {
      await waitForV45Worker();
    } catch (_) {}
    await import('./app.js?v=45');
  </script>
</body>
</html>
