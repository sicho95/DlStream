<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DlStream">
  <title>DlStream</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="browser" class="browser-shell">
    <iframe
      id="platformFrame"
      title="Plateforme de streaming"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <button id="menuButton" class="floating-button menu-button" type="button" aria-label="Réglages">•••</button>
    <button id="downloadButton" class="floating-button download-button" type="button" aria-label="Télécharger" title="Télécharger" hidden>↓</button>

    <div id="mediaToast" class="media-toast" hidden>
      <span id="mediaTitle">Vidéo</span>
      <button id="toastDownloadButton" type="button">Télécharger</button>
    </div>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div>
          <strong>DlStream</strong>
          <small>Configuration</small>
        </div>
        <button value="cancel" class="icon-button" aria-label="Fermer">×</button>
      </div>

      <label class="field">
        <span>URL de la plateforme</span>
        <input id="settingsPlatformUrl" type="url" inputmode="url" autocomplete="url" spellcheck="false">
      </label>

      <div class="sheet-actions">
        <button id="saveSettingsButton" value="default" class="primary">Enregistrer et ouvrir</button>
        <button id="reloadButton" type="button">Recharger</button>
        <button id="openDirectButton" type="button">Ouvrir directement</button>
      </div>

      <p class="hint">
        « Ouvrir directement » sert de secours si le site interdit son affichage dans une iframe. Dans ce mode, la page distante prend la main et DlStream ne peut plus superposer son bouton de téléchargement.
      </p>

      <details>
        <summary>Test média personnel</summary>
        <div class="manual-test">
          <input id="manualTitle" type="text" placeholder="Titre" value="Ma vidéo">
          <input id="manualDownloadUrl" type="url" placeholder="URL directe du fichier à télécharger">
          <button id="manualDownloadButton" type="button">Afficher le bouton téléchargement</button>
        </div>
      </details>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
